<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none">
  <!-- Símbolo Isótipo Oficial Aferix -->
  <g transform="translate(10, 8)">
    <!-- Checkmark + Estrutura da Letra A -->
    <path
      d="M 6 48 L 24 48 L 42 82 L 68 24 L 92 82 L 74 82"
      stroke="#0D4F9C"
      stroke-width="8"
      stroke-linecap="square"
      stroke-linejoin="miter"
      stroke-miterlimit="4"
    />
    <!-- Haste Diagonal Ascendente -->
    <path
      d="M 44 76 L 79 24"
      stroke="#0D4F9C"
      stroke-width="8"
      stroke-linecap="square"
    />
    <!-- Porca Sextavada Laranja Oficial -->
    <!-- Hexágono externo (centro: 87, 15 | R = 11) com furo hexagonal/circular interno (r = 4.8) -->
    <path
      d="M 81.5 5.5 L 92.5 5.5 L 98 15 L 92.5 24.5 L 81.5 24.5 L 76 15 Z M 87 11.2 A 3.8 3.8 0 1 0 87 18.8 A 3.8 3.8 0 1 0 87 11.2 Z"
      fill="#F58220"
      fill-rule="evenodd"
    />
  </g>

  <!-- Wordmark Aferix -->
  <g transform="translate(142, 60)">
    <text
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
      font-size="46"
      font-weight="900"
      fill="#0D4F9C"
      letter-spacing="-0.5"
    >
      Afer<tspan fill="#0D4F9C">i</tspan>x
    </text>
    <!-- Ponto circular Laranja do 'i' (substitui o pingo comum) -->
    <!-- Na escala da fonte 46px, o 'i' fica posicionado aproximadamente em x: 81, y: -38 -->
    <circle cx="82" cy="-39" r="5.2" fill="#F58220" />
  </g>

  <!-- Slogan Oficial: Soluções para ERP -->
  <text
    x="144"
    y="88"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
    font-size="14.5"
    font-weight="600"
    fill="#475569"
    letter-spacing="0.2"
  >
    Soluções para ERP
  </text>
</svg>
